components:
  schemas:
    AccountTypeEnum:
      enum:
      - A
      - L
      - E
      type: string
      description: |-
        * `A` - Asset
        * `L` - Liability
        * `E` - Equity
    Bagging:
      type: object
      description: Serializer for Bagging model (final stage)
      properties:
        id:
          type: integer
          readOnly: true
        processing_id:
          type: string
          description: Unique ID for this bagging batch (e.g., BAG-2024-001)
          maxLength: 50
        name:
          type: string
          description: Descriptive name for this batch
          maxLength: 100
        grade:
          allOf:
          - $ref: '#/components/schemas/GradeEnum'
          description: |-
            Quality grade of the coffee

            * `A` - Grade A
            * `B` - Grade B
            * `C` - Grade C
        moisture_content:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Final moisture content percentage (0-100%)
        date:
          type: string
          format: date
          description: Date when bagging occurred
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Final weight in kg
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - grade
      - id
      - moisture_content
      - name
      - processing_id
      - updated_at
      - weight
    Balancesheet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account_name:
          type: string
          description: Name of the account (e.g., 'Cash', 'Accounts Receivable', etc.)
          maxLength: 100
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_type_display:
          type: string
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          description: The current balance of this account.
        last_updated:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_name
      - account_type
      - account_type_display
      - id
      - last_updated
    BlankEnum:
      enum:
      - ''
    CherryColour051Enum:
      enum:
      - red
      - green
      - Yellow
      - Black
      type: string
      description: |-
        * `red` - Red
        * `green` - Green
        * `Yellow` - Yellow
        * `Black` - Black
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        expense_name:
          type: string
          maxLength: 50
        category:
          type: string
          maxLength: 50
        item:
          type: string
          maxLength: 50
        supplier:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 255
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        location:
          type: string
          maxLength: 100
      required:
      - amount
      - category
      - date
      - description
      - expense_name
      - id
      - item
      - location
      - supplier
    Farmer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
