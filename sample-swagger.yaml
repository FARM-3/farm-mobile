  /api/processing/fermenting/:
    get:
      operationId: api_processing_fermenting_list
      description: |-
        ViewSet for Fermenting process

        Automatically provides these endpoints:
        - GET /api/fermenting/ - List all records
        - POST /api/fermenting/ - Create new record
        - GET /api/fermenting/{id}/ - Get single record
        - PUT /api/fermenting/{id}/ - Update record (full)
        - PATCH /api/fermenting/{id}/ - Update record (partial)
        - DELETE /api/fermenting/{id}/ - Delete record
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: days
        schema:
          type: integer
      - in: query
        name: grade
        schema:
          type: string
          enum:
          - A
          - B
          - C
        description: |-
          Quality grade of the coffee

          * `A` - Grade A
          * `B` - Grade B
          * `C` - Grade C
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFermentingList'
          description: ''
    post:
      operationId: api_processing_fermenting_create
      description: |-
        ViewSet for Fermenting process

        Automatically provides these endpoints:
        - GET /api/fermenting/ - List all records
        - POST /api/fermenting/ - Create new record
        - GET /api/fermenting/{id}/ - Get single record
        - PUT /api/fermenting/{id}/ - Update record (full)
        - PATCH /api/fermenting/{id}/ - Update record (partial)
        - DELETE /api/fermenting/{id}/ - Delete record
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fermenting'
