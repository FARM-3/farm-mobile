          type: integer
          maximum: 2147483647
          minimum: -2147483648
        weight_after_floating:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        date_of_delivery:
          type: string
          maxLength: 100
        grade:
          type: string
          maxLength: 100
        cherry_color:
          type: string
          maxLength: 100
        stage:
          type: string
          maxLength: 100
        amount_paid:
          type: string
          maxLength: 100
        paid_by:
          type: string
          maxLength: 100
      required:
      - amount_paid
      - cherry_color
      - date_of_delivery
      - grade
